<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>

    <linearGradient id="flowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="nodeBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101F38"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .f-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .f-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94A3B8; }
    .f-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; font-size: 11px; font-weight: 700; }
    .f-edge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38BDF8; font-weight: 600; }
  </style>

  <!-- Base Panel -->
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="url(#flowBg)"/>
  <rect x="0" y="0" width="1200" height="520" rx="16" fill="none" stroke="url(#flowBorder)" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1200" height="46" rx="16" fill="#0D1A30"/>
  <rect x="0" y="30" width="1200" height="16" fill="#0D1A30"/>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#1E293B" stroke-width="1"/>
  <circle cx="28" cy="23" r="5" fill="#FB7185"/>
  <circle cx="46" cy="23" r="5" fill="#F59E0B"/>
  <circle cx="64" cy="23" r="5" fill="#2DD4BF"/>
  <text x="96" y="28" class="f-title" font-size="13px" fill="#F8FAFC">AGENTX TRANSACTION CONTROL FLOW &amp; AMBIGUITY RECONCILIATION</text>

  <!-- Ambient Glow in Center -->
  <circle cx="600" cy="180" r="280" fill="url(#cyanGlow)"/>

  <!-- ================= MAIN FORWARD PIPELINE ================= -->

  <!-- Node 1: AI Agent Host -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="170" height="110" rx="12" fill="url(#nodeBox)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#07111F" stroke="#38BDF8" stroke-width="1"/>
    <text x="18" y="27" fill="#38BDF8" font-size="11px" font-weight="bold">1</text>
    <text x="42" y="28" class="f-title">AI Agent Host</text>
    <text x="14" y="58" class="f-sub">• Claude Desktop</text>
    <text x="14" y="76" class="f-sub">• Cursor / Antigravity</text>
    <text x="14" y="94" class="f-sub">• tools/call (stdio)</text>
  </g>

  <!-- Node 2: AgentX Stdio Proxy Interceptor -->
  <g transform="translate(260, 90)">
    <rect x="0" y="0" width="180" height="110" rx="12" fill="url(#nodeBox)" stroke="#43D9FF" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#07111F" stroke="#43D9FF" stroke-width="1"/>
    <text x="18" y="27" fill="#43D9FF" font-size="11px" font-weight="bold">2</text>
    <text x="42" y="28" class="f-title">Stdio Interceptor</text>
    <text x="14" y="58" class="f-sub">• Transparent proxy</text>
    <text x="14" y="76" class="f-sub">• Zero tool changes</text>
    <text x="14" y="94" class="f-sub">• Manifest inspector</text>
  </g>

  <!-- Node 3: Canonical Fingerprinter -->
  <g transform="translate(490, 90)">
    <rect x="0" y="0" width="190" height="110" rx="12" fill="url(#nodeBox)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#07111F" stroke="#38BDF8" stroke-width="1"/>
    <text x="18" y="27" fill="#38BDF8" font-size="11px" font-weight="bold">3</text>
    <text x="42" y="28" class="f-title">Fingerprinter</text>
    <text x="14" y="58" class="f-sub">• Canonical JSON sort</text>
    <text x="14" y="76" class="f-sub">• Logical key extract</text>
    <text x="14" y="94" class="f-sub">• Deterministic SHA-256</text>
  </g>

  <!-- Node 4: SQLite WAL Ledger -->
  <g transform="translate(730, 90)">
    <rect x="0" y="0" width="190" height="110" rx="12" fill="url(#nodeBox)" stroke="#2DD4BF" stroke-width="2"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#07111F" stroke="#2DD4BF" stroke-width="1"/>
    <text x="18" y="27" fill="#2DD4BF" font-size="11px" font-weight="bold">4</text>
    <text x="42" y="28" class="f-title">SQLite Ledger</text>
    <text x="14" y="58" class="f-sub">• Local WAL mode</text>
    <text x="14" y="76" class="f-sub">• PENDING → EXECUTING</text>
    <text x="14" y="94" class="f-sub">• Secret redaction</text>
  </g>

  <!-- Node 5: Target Downstream MCP Server -->
  <g transform="translate(970, 90)">
    <rect x="0" y="0" width="190" height="110" rx="12" fill="url(#nodeBox)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="12" y="12" width="22" height="22" rx="6" fill="#07111F" stroke="#94A3B8" stroke-width="1"/>
    <text x="18" y="27" fill="#94A3B8" font-size="11px" font-weight="bold">5</text>
    <text x="42" y="28" class="f-title">Target MCP Server</text>
    <text x="14" y="58" class="f-sub">• Postgres / Stripe</text>
    <text x="14" y="76" class="f-sub">• GitHub / Slack</text>
    <text x="14" y="94" class="f-sub">• Custom MCP tools</text>
  </g>

  <!-- MAIN CONNECTIONS -->
  <path d="M 210 145 L 260 145" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="256,140 264,145 256,150" fill="#43D9FF"/>

  <path d="M 440 145 L 490 145" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="486,140 494,145 486,150" fill="#43D9FF"/>

  <path d="M 680 145 L 730 145" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="726,140 734,145 726,150" fill="#43D9FF"/>

  <path d="M 920 145 L 970 145" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="966,140 974,145 966,150" fill="#43D9FF"/>

  <!-- ================= 3 SPECIALIZED BRANCH PANELS ================= -->

  <!-- BRANCH 1: REPLAY PROTECTION -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="340" height="210" rx="12" fill="#0C1527" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="32" rx="12" fill="#171C38"/>
    <rect x="0" y="20" width="340" height="12" fill="#171C38"/>
    <circle cx="16" cy="16" r="4" fill="#8B5CF6"/>
    <text x="30" y="20" class="f-badge" fill="#A78BFA">BRANCH A: REPLAY PROTECTION</text>

    <text x="16" y="58" class="f-title" font-size="13px">Deterministic Duplicate Intercept</text>
    <text x="16" y="82" class="f-sub">If fingerprinted key exists in state</text>
    <text x="16" y="100" class="f-sub"><tspan fill="#2DD4BF">COMMITTED</tspan> in durable SQLite ledger:</text>

    <rect x="16" y="118" width="308" height="74" rx="8" fill="#070E1A" stroke="#1E293B"/>
    <text x="26" y="140" class="f-sub" fill="#A78BFA">↳ Short-circuits tool call</text>
    <text x="26" y="160" class="f-sub" fill="#2DD4BF">↳ Returns cached receipt</text>
    <text x="26" y="180" class="f-sub" fill="#F8FAFC">↳ <tspan fill="#43D9FF">0 downstream RPC invocations</tspan></text>
  </g>

  <!-- BRANCH 2: POSTCONDITION VERIFICATION -->
  <g transform="translate(430, 260)">
    <rect x="0" y="0" width="340" height="210" rx="12" fill="#0C1527" stroke="#2DD4BF" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="32" rx="12" fill="#102B33"/>
    <rect x="0" y="20" width="340" height="12" fill="#102B33"/>
    <circle cx="16" cy="16" r="4" fill="#2DD4BF"/>
    <text x="30" y="20" class="f-badge" fill="#2DD4BF">BRANCH B: ACTIVE VERIFICATION</text>

    <text x="16" y="58" class="f-title" font-size="13px">Ambiguity Resolution Engine</text>
    <text x="16" y="82" class="f-sub">When network times out or drops:</text>
    <text x="16" y="100" class="f-sub">State set to <tspan fill="#F59E0B">AMBIGUOUS</tspan> → Runs verifier</text>

    <rect x="16" y="118" width="308" height="74" rx="8" fill="#070E1A" stroke="#1E293B"/>
    <text x="26" y="140" class="f-sub" fill="#2DD4BF">✓ PROVEN_COMMITTED → Receipts</text>
    <text x="26" y="160" class="f-sub" fill="#FB7185">✗ PROVEN_ABSENT → Retry / Fail</text>
    <text x="26" y="180" class="f-sub" fill="#F59E0B">⚠ INCONCLUSIVE → Fail-Closed</text>
  </g>

  <!-- BRANCH 3: SAGA COMPENSATION -->
  <g transform="translate(820, 260)">
    <rect x="0" y="0" width="340" height="210" rx="12" fill="#0C1527" stroke="#FB7185" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="32" rx="12" fill="#2B1424"/>
    <rect x="0" y="20" width="340" height="12" fill="#2B1424"/>
    <circle cx="16" cy="16" r="4" fill="#FB7185"/>
    <text x="30" y="20" class="f-badge" fill="#FB7185">BRANCH C: SAGA COMPENSATION</text>

    <text x="16" y="58" class="f-title" font-size="13px">Multi-Step Rollback Coordinator</text>
    <text x="16" y="82" class="f-sub">When step 3 of composite workflow fails:</text>
    <text x="16" y="100" class="f-sub">Triggers registered compensators:</text>

    <rect x="16" y="118" width="308" height="74" rx="8" fill="#070E1A" stroke="#1E293B"/>
    <text x="26" y="140" class="f-sub" fill="#A78BFA">↺ Reverse LIFO execution</text>
    <text x="26" y="160" class="f-sub" fill="#2DD4BF">↺ Dynamic param binding</text>
    <text x="26" y="180" class="f-sub" fill="#F8FAFC">↺ Updates state: <tspan fill="#A78BFA">COMPENSATED</tspan></text>
  </g>
</svg>
