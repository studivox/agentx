<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="60%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#43D9FF" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="violetGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132038" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A1324" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#43D9FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 800; fill: #F8FAFC; letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #43D9FF; letter-spacing: 0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #94A3B8; }
    .node-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
    .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; fill: #94A3B8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #F8FAFC; }
    .edge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38BDF8; font-weight: 600; }
    .rev-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #A78BFA; font-weight: 600; }
  </style>

  <!-- Container Base -->
  <rect x="0" y="0" width="1440" height="520" rx="20" fill="url(#heroBg)"/>
  <rect x="0" y="0" width="1440" height="520" rx="20" fill="none" stroke="url(#heroBorder)" stroke-width="2"/>

  <!-- Ambient Glow Backgrounds -->
  <circle cx="280" cy="180" r="300" fill="url(#glowLeft)"/>
  <circle cx="1100" cy="260" r="350" fill="url(#glowRight)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#43D9FF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/>
    <line x1="440" y1="0" x2="440" y2="520"/>
    <line x1="560" y1="0" x2="560" y2="520"/>
    <line x1="680" y1="0" x2="680" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
    <line x1="920" y1="0" x2="920" y2="520"/>
    <line x1="1040" y1="0" x2="1040" y2="520"/>
    <line x1="1160" y1="0" x2="1160" y2="520"/>
    <line x1="1280" y1="0" x2="1280" y2="520"/>
    <line x1="1400" y1="0" x2="1400" y2="520"/>
    <line x1="0" y1="80" x2="1440" y2="80"/>
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
  </g>

  <!-- ================= LEFT BRAND IDENTITY AREA ================= -->
  <g transform="translate(80, 70)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#13233D" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="16" r="5" fill="#2DD4BF"/>
    <text x="32" y="21" class="pill-text">TRANSACTIONAL MCP RELIABILITY</text>

    <!-- Main Title -->
    <g transform="translate(0, 80)">
      <!-- Logo Symbol -->
      <g transform="translate(0, -32) scale(0.18)">
        <rect x="16" y="16" width="480" height="480" rx="108" fill="#0D1728" stroke="#43D9FF" stroke-width="12"/>
        <path d="M 390 122 L 286 226 M 226 286 L 122 390" stroke="#8B5CF6" stroke-width="48" stroke-linecap="round"/>
        <path d="M 122 122 L 226 226 M 286 286 L 390 390" stroke="#43D9FF" stroke-width="48" stroke-linecap="round"/>
        <polygon points="256,208 304,256 256,304 208,256" fill="#07111F" stroke="#43D9FF" stroke-width="10"/>
        <circle cx="256" cy="256" r="14" fill="#2DD4BF"/>
      </g>

      <text x="110" y="36" class="title">Agent<tspan fill="#43D9FF">X</tspan></text>
      <text x="0" y="90" class="subtitle">PREVIEW • EXECUTE ONCE • VERIFY • COMPENSATE</text>
      <text x="0" y="130" class="tagline">Local-first transactional proxy &amp; WAL ledger for MCP tools.</text>
      <text x="0" y="160" class="tagline">Zero downstream code changes. Complete replay protection.</text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#0B1728" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#43D9FF"/>
      <text x="28" y="22" class="node-header" font-size="12px">Execute Once</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="130" height="34" rx="8" fill="#0B1728" stroke="#1E293B" stroke-width="1"/>
      <circle cx="158" cy="17" r="4" fill="#2DD4BF"/>
      <text x="170" y="22" class="node-header" font-size="12px">Verify Reality</text>

      <!-- Pill 3 -->
      <rect x="284" y="0" width="144" height="34" rx="8" fill="#0B1728" stroke="#1E293B" stroke-width="1"/>
      <circle cx="300" cy="17" r="4" fill="#8B5CF6"/>
      <text x="312" y="22" class="node-header" font-size="12px">Saga Rollback</text>
    </g>
  </g>

  <!-- ================= RIGHT PIPELINE DIAGRAM AREA ================= -->
  <g transform="translate(680, 50)">
    <!-- Diagram Card Backdrop -->
    <rect x="0" y="0" width="680" height="420" rx="16" fill="#08101E" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Top Diagram Header Bar -->
    <rect x="0" y="0" width="680" height="40" rx="16" fill="#0D1A30"/>
    <rect x="0" y="24" width="680" height="16" fill="#0D1A30"/>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#1E293B" stroke-width="1"/>
    <!-- macOS style dots -->
    <circle cx="24" cy="20" r="6" fill="#FB7185"/>
    <circle cx="44" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="20" r="6" fill="#2DD4BF"/>
    <text x="100" y="25" class="edge-text" font-size="12px">TRANSACTION EXECUTION PIPELINE</text>
    <text x="560" y="25" class="node-sub" font-size="11px">STDIO / LOCAL WAL</text>

    <!-- PIPELINE STAGES -->

    <!-- 1. AI Host -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="170" height="88" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#07111F" stroke="#38BDF8" stroke-width="1"/>
      <text x="19" y="28" fill="#38BDF8" font-size="12px" font-weight="bold">AI</text>
      <text x="46" y="28" class="node-header">Host / Agent</text>
      <text x="12" y="56" class="node-sub">Claude / Cursor</text>
      <text x="12" y="72" class="node-sub">tools/call (stdio)</text>
    </g>

    <!-- 2. AgentX Interceptor & Ledger -->
    <g transform="translate(250, 60)">
      <rect x="0" y="0" width="200" height="128" rx="12" fill="url(#cardGrad)" stroke="#43D9FF" stroke-width="2"/>
      <!-- Header Badge -->
      <rect x="0" y="0" width="200" height="28" rx="12" fill="#102544"/>
      <rect x="0" y="16" width="200" height="12" fill="#102544"/>
      <text x="14" y="19" class="node-header" font-size="12px" fill="#43D9FF">AgentX Engine</text>

      <text x="14" y="52" class="node-header" font-size="13px">Durable Ledger</text>
      <text x="14" y="70" class="node-sub">• Canonical SHA-256</text>
      <text x="14" y="88" class="node-sub">• SQLite WAL Mode</text>
      <text x="14" y="106" class="node-sub">• Secret Redaction</text>
    </g>

    <!-- 3. Downstream MCP Server -->
    <g transform="translate(500, 80)">
      <rect x="0" y="0" width="150" height="88" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
      <text x="14" y="28" class="node-header">Target MCP</text>
      <text x="14" y="52" class="node-sub">DB / Payments</text>
      <text x="14" y="70" class="node-sub">APIs &amp; Cloud</text>
    </g>

    <!-- 4. Active Verifier (Ambiguity Branch) -->
    <g transform="translate(250, 240)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="14" y="26" class="node-header" fill="#2DD4BF">Active Verifier</text>
      <text x="14" y="48" class="node-sub">Interrogates reality on timeout</text>
      <text x="14" y="66" class="node-sub">Resolves AMBIGUOUS state</text>
    </g>

    <!-- 5. Saga Coordinator (Rollback Branch) -->
    <g transform="translate(250, 335)">
      <rect x="0" y="0" width="200" height="65" rx="10" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="14" y="24" class="node-header" fill="#A78BFA">Saga Coordinator</text>
      <text x="14" y="46" class="node-sub">LIFO Reverse Compensation</text>
    </g>

    <!-- CONNECTING TRACKS -->

    <!-- Forward Track 1: AI Host -> AgentX -->
    <path d="M 200 124 L 250 124" stroke="url(#cyanGradient)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="248,120 256,124 248,128" fill="#43D9FF"/>

    <!-- Forward Track 2: AgentX -> Downstream MCP -->
    <path d="M 450 124 L 500 124" stroke="url(#cyanGradient)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="498,120 506,124 498,128" fill="#43D9FF"/>

    <!-- Replay Short-Circuit Arrow: AgentX -> AI Host -->
    <path d="M 250 100 L 200 100" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
    <polygon points="204,96 196,100 204,104" fill="#8B5CF6"/>
    <text x="135" y="94" class="rev-text" font-size="9px">Replay (0 calls)</text>

    <!-- Downstream Timeout / Drop -> Verifier -->
    <path d="M 575 168 L 575 280 L 450 280" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
    <polygon points="454,276 446,280 454,284" fill="#F59E0B"/>
    <text x="475" y="272" class="node-sub" fill="#F59E0B" font-size="10px">Timeout</text>

    <!-- Verifier -> AgentX Ledger Resolution -->
    <path d="M 350 240 L 350 188" stroke="#2DD4BF" stroke-width="2" fill="none"/>
    <polygon points="346,192 350,184 354,192" fill="#2DD4BF"/>
    <text x="358" y="215" class="node-sub" fill="#2DD4BF" font-size="10px">Reconcile</text>

    <!-- Failure / Rollback -> Saga Coordinator -->
    <path d="M 350 335 L 350 320" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  </g>
</svg>
