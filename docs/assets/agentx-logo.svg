<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0D1728"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Forward Transaction Track (Cyan -> Mint) -->
    <linearGradient id="forwardTrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#43D9FF"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Verification / Return Track (Violet -> Amber) -->
    <linearGradient id="returnTrack" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Central Node Glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#43D9FF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1728"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base with Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Background Decorative Grid Matrix -->
  <g opacity="0.12" stroke="#43D9FF" stroke-width="1">
    <line x1="96" y1="64" x2="96" y2="448"/>
    <line x1="176" y1="64" x2="176" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="336" y1="64" x2="336" y2="448"/>
    <line x1="416" y1="64" x2="416" y2="448"/>
    <line x1="64" y1="96" x2="448" y2="96"/>
    <line x1="64" y1="176" x2="448" y2="176"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="336" x2="448" y2="336"/>
    <line x1="64" y1="416" x2="448" y2="416"/>
  </g>

  <!-- Ambient Glow Behind X -->
  <circle cx="256" cy="256" r="140" fill="url(#nodeGlow)"/>

  <!-- Return / Verification Track (Top-Right to Bottom-Left) -->
  <path d="M 390 122 L 286 226 M 226 286 L 122 390" 
        stroke="url(#returnTrack)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Return Arrow Head (Bottom-Left) -->
  <path d="M 122 350 L 122 390 L 162 390" 
        stroke="url(#returnTrack)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Forward Execution Track (Top-Left to Bottom-Right) -->
  <path d="M 122 122 L 226 226 M 286 286 L 390 390" 
        stroke="url(#forwardTrack)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Forward Arrow Head (Bottom-Right) -->
  <path d="M 350 390 L 390 390 L 390 350" 
        stroke="url(#forwardTrack)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Connection Nodes on Endpoints -->
  <circle cx="122" cy="122" r="18" fill="#07111F" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="390" cy="122" r="18" fill="#07111F" stroke="#8B5CF6" stroke-width="8"/>
  <circle cx="122" cy="390" r="12" fill="#2DD4BF"/>
  <circle cx="390" cy="390" r="12" fill="#38BDF8"/>

  <!-- Central Checkpoint / Ledger Diamond Node -->
  <g transform="translate(256, 256)">
    <!-- Outer Diamond -->
    <polygon points="0,-48 48,0 0,48 -48,0" fill="url(#nodeGrad)" stroke="#43D9FF" stroke-width="6"/>
    <!-- Inner Checkpoint Core -->
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#07111F" stroke="#8B5CF6" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#2DD4BF"/>
  </g>

  <!-- Pulse Accents on Paths -->
  <circle cx="180" cy="180" r="6" fill="#FFFFFF"/>
  <circle cx="332" cy="332" r="6" fill="#FFFFFF"/>
  <circle cx="332" cy="180" r="5" fill="#DDD6FE"/>
  <circle cx="180" cy="332" r="5" fill="#A7F3D0"/>
</svg>
